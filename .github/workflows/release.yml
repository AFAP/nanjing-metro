name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Package and checksum
        run: |
          mkdir -p release
          archive="nanjing-metro-${GITHUB_SHA:0:7}.zip"
          zip -qr "release/$archive" dist LICENSE NOTICE.md
          cd release
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: static-website
          path: release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-website
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
